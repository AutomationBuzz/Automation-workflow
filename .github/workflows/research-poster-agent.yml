name: CHILD & HOPE - Research to Poster

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 5"

permissions:
  contents: write

concurrency:
  group: child-hope-research-ledger
  cancel-in-progress: false

jobs:
  research-and-create-poster:
    runs-on: ubuntu-latest
    environment: facebook-production
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate required configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing from the facebook-production environment."
            exit 1
          fi

      - name: Create research poster draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          RESEARCH_DAYS_BACK: "365"
          RESEARCH_MAX_RECORDS: "50"
        run: python src/research_poster_agent.py

      - name: Validate poster output before any publication
        if: success()
        run: |
          set -euo pipefail
          test -s artifacts/child_hope_research_poster.png
          test -s artifacts/research_summary.md
          test -s artifacts/poster_caption.txt
          grep -q "Status: DRAFT" artifacts/research_summary.md
          grep -q "https://pubmed.ncbi.nlm.nih.gov/" artifacts/poster_caption.txt
          python - <<'PY'
          from PIL import Image
          image = Image.open("artifacts/child_hope_research_poster.png")
          image.verify()
          image = Image.open("artifacts/child_hope_research_poster.png")
          if image.size != (1080, 1350):
              raise SystemExit(f"Unexpected poster dimensions: {image.size}")
          caption = open("artifacts/poster_caption.txt", encoding="utf-8").read().strip()
          if len(caption) < 80 or len(caption) > 5000:
              raise SystemExit("Caption length is outside safe limits.")
          print("Poster image, source citation, summary, and caption checks passed.")
          PY

      - name: Publish validated poster automatically
        if: success() && vars.AUTO_PUBLISH == 'true'
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          EXPECTED_FB_PAGE_ID: "1345909531941708"
          FB_GRAPH_VERSION: "v23.0"
          POSTER_DIR: artifacts
        run: |
          set -euo pipefail
          if [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "::error::AUTO_PUBLISH=true but FB_PAGE_ACCESS_TOKEN is missing from facebook-production."
            exit 1
          fi
          python src/publish_research_poster.py

      - name: Keep draft-only mode when automatic publishing is disabled
        if: success() && vars.AUTO_PUBLISH != 'true'
        run: echo "Poster generated and validated. AUTO_PUBLISH is not true; no Facebook post was sent."

      - name: Commit research deduplication history
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Track research source used by poster agent"
          file_pattern: data/research_history.json

      - name: Upload poster and evidence report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: child-hope-research-poster-draft
          path: |
            artifacts/child_hope_research_poster.png
            artifacts/research_summary.md
            artifacts/poster_caption.txt
          if-no-files-found: error
          retention-days: 30
